<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Harbour</title>
  <meta name="description" content="Harbour — your all-in-one life OS. Swim coaching, finances, and more in one place." />
  <meta name="theme-color" content="#f6f3ec" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Harbour" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preload" href="fonts/spacegrotesk-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/instrumentsans-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app" class="app">
    <div class="boot-splash" id="bootSplash" aria-hidden="true">
      <svg class="boot-mark" viewBox="0 0 28 28" width="56" height="56" aria-hidden="true">
        <rect x="3" y="4.5" width="13" height="5" rx="2.5" fill="#16283a"/>
        <rect x="3" y="11.5" width="22" height="5" rx="2.5" fill="#0e8da6"/>
        <rect x="3" y="18.5" width="17" height="5" rx="2.5" fill="#16283a"/>
      </svg>
      <div class="boot-word">harbour</div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
